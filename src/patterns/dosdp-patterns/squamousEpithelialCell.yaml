pattern_name: squamousEpithelialCell
pattern_iri: http://purl.obolibrary.org/obo/cl/squamousEpithelialCell

description: An epithelial cell characterized by a broad, flat morphology. Squamous epithelial cells are typically found lining body surfaces subject to stretching and abrasion.

contributors:
  - https://orcid.org/0000-0001-5208-3432

